# A security fault must not become a public issue, so the blank-issue route is
# closed and the one link here says where it does go.
#
# There is deliberately no link to Discussions: it is switched off on this
# repository, and a contact link to a page that 404s is worse than no link.
# Turn Discussions on and a "questions go here" link belongs in this file.
blank_issues_enabled: false
contact_links:
  - name: Found a security problem?
    url: https://github.com/pnscripts/pn-scripts-assistant/security/advisories/new
    about: Report it privately — not as an issue. See SECURITY.md.
