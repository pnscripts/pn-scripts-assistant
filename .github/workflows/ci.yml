name: CI

# Every push and every pull request, which is the gap this file closes.
#
# Until this existed the only workflow ran on tags and on a button. So the
# tests ran when somebody made a release — after the work, not during it — and
# a pull request from anybody arrived with nothing at all having checked it.
# For a program that reads somebody's files and runs commands on their machine,
# "the tests passed on my laptop" is not an answer a stranger can verify.
#
# Tags are left to release.yml, which runs the same checks before it builds
# anything, so a tag does not run both.
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

# Read, and nothing else. A workflow that can write to the repository is a
# workflow that a compromised dependency can write to the repository with, and
# nothing here needs to write. The release workflow asks for more, in the one
# job that publishes.
permissions:
  contents: read

# A second push to the same branch stops the first. Nothing here has side
# effects, so there is nothing to half-finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No test makes a sound or opens a microphone, including anything a test starts
# as a subprocess. See clients/internal/brain/speech/silent.go.
env:
  PN_SCRIPTS_ASSISTANT_SILENT: "1"

jobs:
  # Formatting, vet, and that two versions sort the way dpkg thinks they do.
  # Cheapest of the lot and the one most worth failing on.
  check:
    name: Formatting and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain go.mod asks for, not the newest of that line.
      #
      # `go-version: 1.26` installed whatever 1.26.x was newest, which was
      # 1.26.8 on the runner against 1.26.6 here — and that one difference was
      # the whole reason a package built in CI and a package built on the
      # maintainer's desktop, from the same commit, were not the same file.
      # Every other build setting matched, and so did the control file.
      #
      # go.mod already says which toolchain this is built with and why. This
      # makes CI read it rather than have an opinion of its own, which is the
      # same rule the version number follows: one place says so.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go.mod
          cache-dependency-path: clients/go.sum

      # vet reaches the window, which is cgo against GTK and WebKit.
      - name: Install what the window needs
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - run: make check

  # Every test in the module, with the window compiled in.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go.mod
          cache-dependency-path: clients/go.sum

      - name: Install what the window needs
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # -race, which the release workflow does not run: this program answers
      # on HTTP while a learning worker writes to the same database, and a data
      # race there is a corrupted brain rather than a crash somebody notices.
      - name: Tests, with the race detector
        working-directory: clients
        env:
          CGO_ENABLED: '1'
        run: go test -race ./... -p 2

  # It builds for every system it claims to build for.
  #
  # Cross-compiled rather than run, which is the honest limit of what one
  # Linux runner can say: that the code compiles for a Mac and for Windows.
  # Whether it *runs* there is what the release workflow's own macOS and
  # Windows jobs are for.
  portable:
    name: Builds for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go.mod
          cache-dependency-path: clients/go.sum

      - name: Build every command
        working-directory: clients
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -o /dev/null ./cmd/pn-scripts-assistant
          go build -o /dev/null ./cmd/cli
          go build -o /dev/null ./cmd/doctor

      # The packages that have to work without cgo, tested rather than built:
      # setup and the starter are the first thing a new person meets, and they
      # are what runs on the systems with no window.
      - name: Test what runs without a window
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: clients
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/setup/... ./internal/preflight/... ./internal/starter/... ./internal/stage/... ./internal/protocol/...

  # Known vulnerabilities, in what is imported and in the toolchain itself.
  #
  # Its own job because it needs the network, and on a schedule as well as on
  # a push: a vulnerability is published against code that has not changed,
  # and a check that only runs when somebody commits will not find it.
  vulns:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go.mod
          cache-dependency-path: clients/go.sum

      # The same headers the other jobs install.
      #
      # govulncheck loads every package to see which code is actually
      # reachable — that is what makes it report fewer, truer findings than a
      # scanner reading go.sum. Loading a package means compiling it, and some
      # of these are cgo against GTK and WebKit, so without this the scan does
      # not come back clean: it does not run at all.
      - name: Install what the window needs
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: clients

  # The package somebody actually installs, built and checked from the outside
  # on every change rather than on release day.
  package:
    name: The package, checked from the outside
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is worked out from the tag and the commit, and a
          # shallow checkout has neither.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go.mod
          cache-dependency-path: clients/go.sum

      - name: Install what the window and the packaging need
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            dpkg-dev fakeroot lintian desktop-file-utils

      - name: Build it
        run: make package
        env:
          CGO_ENABLED: '1'

      # lintian with --fail-on error,warning. The package is clean today and
      # the only thing that keeps it clean is a job that refuses when it is not.
      - name: Check it
        run: make validate

      # Built twice from one commit, and the two compared.
      #
      # "Check what you downloaded is what was built" is only as strong as the
      # build being the same build, and it was not: the changelog carried the
      # moment the script ran and dpkg wrote whatever mtime the staging
      # directory happened to have, so one commit produced two checksums. The
      # timestamps are pinned to the commit's own date now, and this is what
      # keeps them pinned — a change that puts a clock back into the build
      # fails here, rather than in six months when somebody compares two
      # downloads and finds they disagree.
      # Kept, so the package this run built can be downloaded and compared
      # with one built anywhere else. A reproducibility claim nobody outside
      # can test is a reproducibility claim on trust.
      - name: It builds the same twice
        env:
          CGO_ENABLED: '1'
        run: |
          first="$(sha256sum build/packages/*.deb | cut -d' ' -f1)"
          make package
          second="$(sha256sum build/packages/*.deb | cut -d' ' -f1)"
          echo "first:  $first"
          echo "second: $second"
          test "$first" = "$second"

          # What the package says about itself, printed so that a build here
          # and a build on somebody's own machine can be compared line by line
          # when their checksums disagree. The Depends line is computed from
          # the libraries installed on the build machine, so it is the first
          # thing to look at.
          dpkg-deb --info build/packages/*.deb | sed -n "2,20p"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-from-ci
          path: build/packages/*.deb

  # The package installs, upgrades and removes.
  #
  # The audit has carried "no automated test installs the package" as an open
  # item since there was an audit. It was done by hand once, which answers the
  # question for one afternoon and not for the next change.
  #
  # dpkg will do all three as an ordinary user into a directory of its own, so
  # this needs no root and no container. --force-script-chrootless is the one
  # that matters: without it dpkg tries to chroot before running maintainer
  # scripts and needs root to do it. --force-depends because the fake root has
  # no libraries in it; what is being tested here is the package's own file
  # handling, and apt's dependency resolution is tested by apt.
  installs:
    needs: package
    name: The package installs, upgrades and removes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-from-ci
          path: package

      - name: Install, upgrade, remove
        run: |
          set -euo pipefail

          deb="$(ls package/*.deb)"
          root="$(mktemp -d)"

          mkdir -p "$root/root" "$root/admin/info" "$root/admin/updates" "$root/admin/triggers"
          : > "$root/admin/status"

          # --log, because the default is /var/log/dpkg.log and this is not root.
          run_dpkg() {
            dpkg --force-not-root --force-script-chrootless --force-depends \
                 --instdir="$root/root" --admindir="$root/admin" \
                 --log="$root/dpkg.log" "$@"
          }

          # A copy with a later version, so the upgrade is an upgrade rather
          # than the same package installed twice.
          dpkg-deb -R "$deb" "$root/next"
          sed -i 's/^Version: .*/&+next/' "$root/next/DEBIAN/control"
          dpkg-deb --build "$root/next" "$root/next.deb" >/dev/null

          echo "--- install"
          run_dpkg -i "$deb"
          installed="$(find "$root/root" -type f | wc -l)"
          echo "    $installed files"
          test "$installed" -gt 0
          test -x "$root/root/usr/bin/pn-scripts-assistant"
          test -f "$root/root/usr/share/applications/pn-scripts-assistant.desktop"
          test -f "$root/root/usr/share/doc/pn-scripts-assistant/copyright"

          echo "--- upgrade"
          run_dpkg -i "$root/next.deb"
          upgraded="$(find "$root/root" -type f | wc -l)"
          echo "    $upgraded files"
          # The same files, not those plus the old ones left behind.
          test "$upgraded" -eq "$installed"

          echo "--- remove"
          run_dpkg -r pn-scripts-assistant
          # Remove keeps the configuration files, as dpkg always does: here
          # the apt repository file, so updates still work if it comes back.
          left="$(find "$root/root" -type f | sort)"
          echo "    left: ${left:-nothing}"
          test "$left" = "$root/root/etc/apt/sources.list.d/pn-scripts-assistant.sources"

          echo "--- purge"
          run_dpkg -P pn-scripts-assistant
          left="$(find "$root/root" -type f | wc -l)"
          echo "    $left files left"
          test "$left" -eq 0

  # What it costs the machine while nobody uses it (owner 08.11.2026: as
  # little as it possibly can). The packaged program opens its real window on
  # a virtual display, is left alone until its page rests, and the program,
  # its page and the display server together must stay under budget — and
  # under a smaller one with the window hidden. Before pace.js the resting
  # window cost over a whole core; see scripts/load-check.sh.
  load:
    needs: package
    name: Idle load stays under budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-from-ci
          path: package

      - name: Install the package, a virtual display and xdotool
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y ./package/*.deb xvfb xdotool

      # A runner draws the resting page through software GL (llvmpipe), which
      # costs about 10 % there against 1 % on a desktop, so its CPU budget is
      # wider; the request count is the same everywhere and is the exact
      # check. The old build measured over 100 % here.
      - name: Resting and hidden, measured
        run: bash scripts/load-check.sh /usr/bin/pn-scripts-assistant 20 3

  # The shell scripts, at the level that catches real mistakes rather than
  # style. Errors only: this is a gate, and a gate that argues about quoting
  # preferences is a gate people start ignoring.
  # The Windows window, opened on a real Windows.
  #
  # The window is WebView2 reached by COM vtable index from Go, and a build for
  # Windows compiling on Linux says nothing about whether those indices are
  # right. So a Windows runner builds the package the way a release does —
  # loader fetched and checked against its SHA-256 — opens a window on a page
  # of its own and fails unless WebView2 says the page loaded.
  windows-window:
    name: The Windows window opens
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go.mod
          cache-dependency-path: clients/go.sum

      # Windows 11 has it; a server image may not. Installed from Microsoft
      # when missing, the same way a person without it would get it.
      - name: Make sure the WebView2 runtime is here
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
          if (-not $pv -or $pv -eq '0.0.0.0') {
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\wv2setup.exe"
            Start-Process -FilePath "$env:RUNNER_TEMP\wv2setup.exe" -ArgumentList '/silent','/install' -Wait
            $pv = (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
          }
          Write-Output "WebView2 runtime: $pv"

      - name: Test the window package
        working-directory: clients
        run: go test ./internal/brain/window/

      # So the build makes the installer too, which the steps after the window
      # install, run and remove.
      - name: Make sure Inno Setup is here
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the Windows folder
        shell: bash
        run: bash scripts/build-packages.sh windows

      - name: The window opens and shows its page
        shell: bash
        run: |
          ls -l build/windows/PN-Scripts-Assistant/WebView2Loader.dll build/windows/PN-Scripts-Assistant/pn-scripts-assistant.ico
          build/windows/PN-Scripts-Assistant/pn-scripts-assistant.exe window-check 120s > window-check.txt 2>&1 || { cat window-check.txt; exit 1; }
          cat window-check.txt
          grep -q "window check OK" window-check.txt
          grep -q "with its icon" window-check.txt
          grep -q "follows a DPI change and hides its page when minimised" window-check.txt

      # What somebody does with the download (G3): the installer, silently,
      # for this account only; the program it installed starts and serves its
      # page; removing it takes the program and leaves the brain.
      - name: The installer installs, the program starts, removing it keeps the brain
        shell: pwsh
        env:
          BRAIN_SETUP_DONE: 'true'
          OLLAMA_BASE_URL: 'http://127.0.0.1:9'
          PN_SCRIPTS_ASSISTANT_SILENT: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem build/packages/*-windows-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'no installer was built' }
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/LOG=$env:RUNNER_TEMP\install.log" -Wait
          $app = "$env:LOCALAPPDATA\Programs\PN Scripts Assistant"
          foreach ($f in 'pn-scripts-assistant.exe','WebView2Loader.dll','WebView2Loader-LICENSE.txt','pn-scripts-assistant.ico') {
            if (-not (Test-Path "$app\$f")) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 30; throw "the installer did not put $f in $app" }
          }
          if (Test-Path "$app\PORTABLE") { throw 'the installed copy is marked portable' }
          Write-Output "installed in $app"

          $p = Start-Process "$app\pn-scripts-assistant.exe" -ArgumentList 'serve','-addr','127.0.0.1:8899' -PassThru
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            try { $up = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8899/health).StatusCode -eq 200 } catch { Start-Sleep 1 }
          }
          if (-not $up) { throw 'the installed program did not answer within 90 s' }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8899/
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'PN Scripts Assistant') { throw 'the page did not come back' }
          Write-Output 'the installed program answers and serves its page'
          Stop-Process -Id $p.Id
          $p.WaitForExit(20000) | Out-Null

          $brain = "$env:USERPROFILE\.local\share\pn-scripts-assistant\data\brain.sqlite"
          if (-not (Test-Path $brain)) { throw "the brain is not where it should be: $brain" }

          $un = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\pn-scripts-assistant.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\pn-scripts-assistant.exe") { throw 'removing it left the program behind' }
          if (-not (Test-Path $brain)) { throw 'removing the program took the brain with it' }
          Write-Output 'removed; the brain is still there'

      # The zip: unpacked anywhere, it keeps its brain beside itself.
      - name: The portable zip keeps its brain beside it
        shell: pwsh
        env:
          BRAIN_SETUP_DONE: 'true'
          OLLAMA_BASE_URL: 'http://127.0.0.1:9'
          PN_SCRIPTS_ASSISTANT_SILENT: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem build/packages/*-windows-amd64.zip | Select-Object -First 1
          $to = "$env:RUNNER_TEMP\stick"
          Expand-Archive $zip.FullName -DestinationPath $to
          $dir = "$to\PN-Scripts-Assistant"
          if (-not (Test-Path "$dir\PORTABLE")) { throw 'the zip is not marked portable' }
          $p = Start-Process "$dir\pn-scripts-assistant.exe" -ArgumentList 'serve','-addr','127.0.0.1:8898' -PassThru
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            try { $up = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8898/health).StatusCode -eq 200 } catch { Start-Sleep 1 }
          }
          if (-not $up) { throw 'the portable program did not answer within 90 s' }
          Stop-Process -Id $p.Id
          $p.WaitForExit(20000) | Out-Null
          if (-not (Test-Path "$dir\PN-SCRIPTS-ASSISTANT-DATA\brain.sqlite")) { throw 'the portable brain is not beside the program' }
          Write-Output 'the portable copy keeps its brain beside it'

  # G15: an older installed copy is told a new version is out, and the
  # Update button replaces it — the real path, end to end, on a real Windows.
  #
  # Two installers from this commit, 0.98.0 and 0.99.0; the older installed
  # the way a person installs it; the newer served as a "release" on this
  # machine (PN_SCRIPTS_ASSISTANT_RELEASES_URL, honoured only for loopback)
  # with its SHA256SUMS. Then: `update --check` says so, the running
  # program's Updates row says so, and POST /api/upkeep/self — what the
  # button sends — downloads, checks, starts the installer and closes the
  # program; the installer puts 0.99.0 in place and opens it again; the brain
  # is still there.
  windows-update:
    name: An older Windows copy updates itself
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go.mod
          cache-dependency-path: clients/go.sum

      - name: Make sure Inno Setup is here
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build 0.99.0 (the "new release") and 0.98.0 (the installed one)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rel" "$RUNNER_TEMP/old"
          VERSION=0.99.0 bash scripts/build-packages.sh windows
          mv build/packages/pn-scripts-assistant-0.99.0-windows-setup.exe "$RUNNER_TEMP/rel/"
          VERSION=0.98.0 bash scripts/build-packages.sh windows
          mv build/packages/pn-scripts-assistant-0.98.0-windows-setup.exe "$RUNNER_TEMP/old/"
          cd "$RUNNER_TEMP/rel"
          sha256sum pn-scripts-assistant-0.99.0-windows-setup.exe > SHA256SUMS
          size=$(stat -c %s pn-scripts-assistant-0.99.0-windows-setup.exe)
          cat > latest <<JSON
          {"tag_name":"v0.99.0","html_url":"https://github.com/pnscripts/pn-scripts-assistant/releases/tag/v0.99.0","assets":[
           {"name":"pn-scripts-assistant-0.99.0-windows-setup.exe","browser_download_url":"http://127.0.0.1:8799/pn-scripts-assistant-0.99.0-windows-setup.exe","size":$size},
           {"name":"SHA256SUMS","browser_download_url":"http://127.0.0.1:8799/SHA256SUMS","size":100}]}
          JSON
          cat latest SHA256SUMS

      - name: An older copy, installed and told a new version is out, updates itself
        shell: pwsh
        env:
          BRAIN_SETUP_DONE: 'true'
          OLLAMA_BASE_URL: 'http://127.0.0.1:9'
          PN_SCRIPTS_ASSISTANT_SILENT: '1'
          PN_SCRIPTS_ASSISTANT_RELEASES_URL: 'http://127.0.0.1:8799/latest'
        run: |
          $ErrorActionPreference = 'Stop'
          $web = Start-Process python -ArgumentList '-m','http.server','8799','--bind','127.0.0.1','--directory',"$env:RUNNER_TEMP\rel" -PassThru
          Start-Sleep 2

          $old = Get-ChildItem "$env:RUNNER_TEMP\old\*-windows-setup.exe" | Select-Object -First 1
          Start-Process $old.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait
          $app = "$env:LOCALAPPDATA\Programs\PN Scripts Assistant"
          $exe = "$app\pn-scripts-assistant.exe"
          # The program is a windowed (GUI) program: PowerShell neither waits
          # for it nor shows what it prints unless its output is redirected.
          function Run-It([string[]]$Arguments) {
            $out = Join-Path $env:RUNNER_TEMP ("out-" + [guid]::NewGuid() + ".txt")
            Start-Process -FilePath $exe -ArgumentList $Arguments -Wait -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError "$out.err" | Out-Null
            ((Get-Content $out -Raw -ErrorAction SilentlyContinue) + (Get-Content "$out.err" -Raw -ErrorAction SilentlyContinue)).Trim()
          }
          $have = Run-It @('version')
          Write-Output "installed: $have"
          if ($have -notmatch '0\.98\.0') { throw 'the old version is not what was installed' }

          # The terminal says so.
          $said = Run-It @('update', '--check')
          Write-Output $said
          if ($said -notmatch 'installed as: installer' -or $said -notmatch 'A newer version is out: 0\.99\.0') { throw 'update --check did not see the new version' }

          # The running program says so, on its Updates page.
          $p = Start-Process $exe -ArgumentList 'serve','-addr','127.0.0.1:8897' -PassThru
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            try { $up = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8897/health).StatusCode -eq 200 } catch { Start-Sleep 1 }
          }
          if (-not $up) { throw 'the installed program did not answer' }
          $upkeep = Invoke-RestMethod http://127.0.0.1:8897/api/upkeep
          $row = $upkeep.items | Where-Object { $_.channel } | Select-Object -First 1
          $row | Format-List | Out-String | Write-Output
          if (-not $row.newer -or $row.latest -ne '0.99.0' -or $row.channel -ne 'installer') { throw 'the Updates row did not offer 0.99.0 through the installer' }

          # The button.
          $out = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{}' http://127.0.0.1:8897/api/upkeep/self
          $out | Format-List | Out-String | Write-Output
          if (-not $out.started) { throw 'the update did not start' }

          # The program gets out of the way...
          if (-not $p.WaitForExit(120000)) { throw 'the program did not close for the installer' }
          Write-Output 'the program closed itself'

          # ...the installer puts the new one in place and opens it again.
          $now = ''
          for ($i = 0; $i -lt 180 -and $now -notmatch '0\.99\.0'; $i++) {
            Start-Sleep 1
            try { $now = Run-It @('version') } catch { $now = '' }
          }
          Write-Output "installed now: $now"
          if ($now -notmatch '0\.99\.0') {
            Get-Process | Where-Object { $_.ProcessName -like 'pn-scripts-assistant*' } | Format-Table Id, ProcessName, Path | Out-String | Write-Output
            Get-ChildItem $env:TEMP -Filter 'Setup Log*' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 | Get-Content -Tail 60
            throw 'the new version was not installed'
          }

          $again = $null
          for ($i = 0; $i -lt 60 -and -not $again; $i++) {
            Start-Sleep 1
            $again = Get-Process pn-scripts-assistant -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
          }
          if (-not $again) { throw 'the new version was not opened again' }
          Write-Output "opened again: pid $($again.Id -join ',')"
          $again | Stop-Process -Force

          $brain = "$env:USERPROFILE\.local\share\pn-scripts-assistant\data\brain.sqlite"
          if (-not (Test-Path $brain)) { throw 'the update lost the brain' }
          Write-Output 'updated, reopened, and the brain is where it was'
          Stop-Process -Id $web.Id

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error scripts/*.sh
