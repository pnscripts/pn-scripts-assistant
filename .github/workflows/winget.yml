name: winget

# The winget manifests for the published releases, proved the way winget
# itself uses them, on a real Windows:
#
#   - written by scripts/winget-manifests.sh from the PUBLISHED setup.exe and
#     its SHA256SUMS (nothing from this commit's build);
#   - `winget validate` on each;
#   - the version before the newest installed exactly as winget installs it
#     (the manifest's InstallerUrl, refused unless its SHA-256 matches, run
#     with winget's switches for Inno plus the manifest's), then the newest
#     over it — what `winget upgrade` does — and the brain made by the first
#     is still there after the second. (winget 1.11 itself hangs launching
#     any installer on windows-latest, so its steps are done here by hand.)
#   - after a release, the newest version's manifests attached to it, ready
#     for the pull request to microsoft/winget-pkgs.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [dev]
    paths:
      - '.github/workflows/winget.yml'
      - 'scripts/winget-manifests.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: pnscripts/pn-scripts-assistant

jobs:
  winget:
    name: winget validate, install the previous version, upgrade to the newest (winget's steps)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BRAIN_SETUP_DONE: 'true'
      OLLAMA_BASE_URL: 'http://127.0.0.1:9'
      PN_SCRIPTS_ASSISTANT_SILENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The newest two releases, and their manifests
        shell: bash
        run: |
          gh release list -R "$REPO" --exclude-drafts --exclude-pre-releases --limit 2 \
            --json tagName --jq '.[].tagName' > tags.txt
          newest="$(sed -n 1p tags.txt)"; previous="$(sed -n 2p tags.txt)"
          echo "NEWEST=${newest#v}" >> "$GITHUB_ENV"
          echo "PREVIOUS=${previous#v}" >> "$GITHUB_ENV"
          bash scripts/winget-manifests.sh "$newest" winget
          bash scripts/winget-manifests.sh "$previous" winget

      - name: winget is here
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version

      - name: winget validate
        shell: pwsh
        run: |
          foreach ($v in $env:PREVIOUS, $env:NEWEST) {
            $dir = "winget\manifests\p\PNScripts\PNScriptsAssistant\$v"
            winget validate --manifest $dir --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "winget validate refused $v" }
          }

      - name: Install the previous version with winget, then the newest over it
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:LOCALAPPDATA\Programs\PN Scripts Assistant\pn-scripts-assistant.exe"
          # The program is a windowed (GUI) program: PowerShell neither waits
          # for it nor shows what it prints unless its output is redirected.
          function Run-It([string[]]$Arguments) {
            $out = Join-Path $env:RUNNER_TEMP ("out-" + [guid]::NewGuid() + ".txt")
            Start-Process -FilePath $exe -ArgumentList $Arguments -Wait -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError "$out.err" | Out-Null
            ((Get-Content $out -Raw -ErrorAction SilentlyContinue) + (Get-Content "$out.err" -Raw -ErrorAction SilentlyContinue)).Trim()
          }
          # What winget does with the manifest, step by step: download the
          # InstallerUrl, refuse it unless its SHA-256 is InstallerSha256, run
          # it with winget's own switches for an Inno installer plus the
          # manifest's Custom ones. winget itself (1.11 on windows-latest)
          # starts the installer and then waits on a process that never
          # appears — on this runner only; `winget validate` above is winget's
          # own word on the manifest.
          function Install-With-Winget([string]$Version) {
            $dir = "winget\manifests\p\PNScripts\PNScriptsAssistant\$Version"
            $m = Get-Content "$dir\PNScripts.PNScriptsAssistant.installer.yaml" -Raw
            $url = [regex]::Match($m, 'InstallerUrl:\s*(\S+)').Groups[1].Value
            $sha = [regex]::Match($m, 'InstallerSha256:\s*(\S+)').Groups[1].Value
            $custom = [regex]::Match($m, 'Custom:\s*(.+)').Groups[1].Value.Trim()
            $file = "$env:RUNNER_TEMP\setup-$Version.exe"
            Invoke-WebRequest -UseBasicParsing $url -OutFile $file
            $got = (Get-FileHash $file -Algorithm SHA256).Hash
            if ($got -ne $sha) { throw "the installer of $Version is not the one the manifest names ($got)" }
            $switches = @('/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\inno-$Version.log") + $custom.Split(' ')
            Write-Output "installing $Version from $url with $($switches -join ' ')"
            $i = Start-Process $file -ArgumentList $switches -PassThru
            if (-not $i.WaitForExit(300000)) { throw "the installer of $Version did not finish in 5 minutes" }
            if ($i.ExitCode -ne 0) { throw "the installer of $Version exited $($i.ExitCode)" }
          }

          Install-With-Winget $env:PREVIOUS
          $have = Run-It @('version')
          Write-Output "installed by winget: $have"
          if ($have -notmatch [regex]::Escape($env:PREVIOUS)) { throw 'not the previous version' }

          # Used once, so there is a brain for the update to keep.
          $p = Start-Process $exe -ArgumentList 'serve','-addr','127.0.0.1:8896' -PassThru
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            try { $up = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8896/health).StatusCode -eq 200 } catch { Start-Sleep 1 }
          }
          if (-not $up) { throw 'the program did not answer' }
          Stop-Process -Id $p.Id
          $p.WaitForExit(20000) | Out-Null
          $brain = "$env:USERPROFILE\.local\share\pn-scripts-assistant\data\brain.sqlite"
          if (-not (Test-Path $brain)) { throw 'no brain was made' }

          Install-With-Winget $env:NEWEST
          $now = Run-It @('version')
          Write-Output "after the upgrade: $now"
          if ($now -notmatch [regex]::Escape($env:NEWEST)) { throw 'the upgrade did not take' }
          if (-not (Test-Path $brain)) { throw 'the upgrade lost the brain' }

          # What winget sees installed (for the log; it matches the package by
          # its ProductCode once the package is in the community source).
          winget list --name 'PN Scripts Assistant' --disable-interactivity --accept-source-agreements
          $global:LASTEXITCODE = 0
          Write-Output 'installed, upgraded, the brain kept'

      - name: What winget and the installer said
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP" -Filter 'inno-*.log' -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 60 }
          Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 3 | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          Get-ChildItem $env:TEMP -Filter 'Setup Log*' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 | Get-Content -Tail 60

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifests
          path: winget/manifests
          if-no-files-found: error

  # The newest release carries its manifests, so the pull request to
  # microsoft/winget-pkgs is a copy of one folder.
  attach:
    name: Attach the manifests to the release
    needs: winget
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: winget-manifests
          path: manifests

      - name: Upload
        run: |
          tag="$(gh release view -R "$REPO" --json tagName --jq .tagName)"
          v="${tag#v}"
          (cd manifests/p/PNScripts/PNScriptsAssistant && zip -r "$GITHUB_WORKSPACE/pn-scripts-assistant-${v}-winget-manifests.zip" "$v")
          gh release upload "$tag" -R "$REPO" --clobber "pn-scripts-assistant-${v}-winget-manifests.zip"
