name: Release

# Builds every distributable artifact. Runs in CI rather than locally so that
# release binaries come from a clean machine rather than somebody's laptop, and
# so that the Windows and macOS builds happen on Windows and macOS.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read, everywhere except the one job that publishes.
#
# A token that can write to the repository is a token that anything running in
# any job can write to the repository with — every action, every dependency,
# every test. Ten of the eleven jobs here only need to read the code, so that
# is all they are given, and the eleventh says what it needs and why.
#
# Every action is pinned to a commit rather than to a tag. A tag is a name its
# owner can move, so `@v4` is a promise to run whatever that account publishes
# next, in a job holding this repository's token. The comment beside each pin
# says which release it is, and dependabot proposes the updates.
permissions:
  contents: read

jobs:
  # Nothing ships if the safety properties are broken.
  #
  # The Laravel core this job used to run went when the program became one Go
  # binary; the job outlived it and could only fail. These are the tests there
  # are now — the gates, the confinement and the evidence rules among them.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache-dependency-path: clients/go.sum

      # CGO for the window layer; the tests themselves need no display.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - run: go test ./...
        working-directory: clients
        env:
          CGO_ENABLED: '1'

      # Known vulnerabilities, in what is imported and in the toolchain
      # itself. The first run of this found twenty-eight in the standard
      # library; none was in this code, and all were fixed by raising the
      # toolchain in go.mod.
      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: clients

  # The package people actually install, built and checked where nobody's
  # laptop can help it along.
  #
  # This was the gap that mattered: every artifact was built in CI except the
  # one the documentation tells somebody to install. A .deb that is only ever
  # built by hand is a .deb whose build is discovered to be broken on the
  # evening of a release.
  #
  # lintian with --fail-on error,warning, because the package is clean today
  # and the only way it stays clean is a job that refuses when it is not.
  deb:
    needs: tests
    name: Ubuntu package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The version is worked out from the tag and the commit, and a
          # shallow checkout has neither.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache-dependency-path: clients/go.sum

      - name: Install what the window and the packaging need
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            dpkg-dev fakeroot lintian desktop-file-utils

      - name: Build the package
        run: make package
        env:
          CGO_ENABLED: '1'

      - name: Check it from the outside
        run: make validate

      - name: Checksums
        run: make checksums

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-deb
          path: |
            build/packages/*.deb
            build/packages/SHA256SUMS

  # The CLI is pure standard library, so every target still cross-compiles from
  # one Linux runner.
  cli:
    needs: tests
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: '' }
          - { goos: linux,   goarch: arm64, ext: '' }
          - { goos: darwin,  goarch: amd64, ext: '' }
          - { goos: darwin,  goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      # The parts this job is actually about: the setup flow, the starter and
      # what they check, which are the first thing a new user meets.
      #
      # It used to run every test in the module, with cgo on and without the
      # GTK and WebKit headers this job does not install — so every package
      # that reaches the window failed to build, and the job reported a broken
      # program where there was a missing library. The brain's own tests,
      # window included, run in the Tests job, which installs them.
      - name: Test the client packages
        working-directory: clients
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/setup/... ./internal/preflight/... ./internal/starter/... ./internal/stage/... ./internal/protocol/...

      - name: Build doctor
        working-directory: clients
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o "../dist/pn-scripts-assistant-doctor-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/doctor

      - name: Build CLI
        working-directory: clients
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o "../dist/pn-scripts-assistant-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/cli

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: clients/dist/*

  # The macOS download: the bundle, the tarball and the disk image.
  #
  # On a Mac rather than cross-compiled, because hdiutil is what makes a real
  # .dmg — an image built with xorriso on Linux does mount, and is what this
  # script falls back to, but the one people download should be the proper
  # article. Nothing here is signed or notarised; the README inside says so.
  macos:
    needs: tests
    name: macOS packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The version is worked out from the tag and the commit.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache-dependency-path: clients/go.sum

      - name: Build the bundles and the disk images
        run: bash scripts/build-packages.sh macos

      # Built by hdiutil here, so it says so. A job that quietly produced the
      # fallback image on a Mac would mean hdiutil had gone missing and nobody
      # would find out until somebody could not open the download.
      - name: It is a real disk image
        run: |
          ls -l build/packages
          for dmg in build/packages/*.dmg; do
            hdiutil imageinfo "$dmg" >/dev/null || exit 1
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-packages
          path: |
            build/packages/*.dmg
            build/packages/*.tar.gz

  # The Windows download: the zip and the installer.
  #
  # On Windows because Inno Setup only runs there. The zip could be built
  # anywhere and is built here anyway, so that what is released is what this
  # job produced rather than two halves from two machines.
  windows:
    needs: tests
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache-dependency-path: clients/go.sum

      # Present on the runner image already, most of the time. Installed when
      # it is not, rather than letting the build quietly skip the installer
      # and publish a release with only the zip in it.
      - name: Make sure Inno Setup is here
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the folder and the installer
        shell: bash
        run: bash scripts/build-packages.sh windows

      # The installer is the point of the job, so its absence fails the job
      # rather than being a warning in a log nobody reads.
      - name: There is an installer
        shell: bash
        run: |
          ls -l build/packages
          ls build/packages/*-windows-setup.exe >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packages
          path: |
            build/packages/*.exe
            build/packages/*.zip

  # The desktop app draws a real native window, which means cgo against the
  # platform's own web engine — and cgo cannot be cross-compiled without a full
  # cross toolchain. Each OS therefore builds on its own runner. Only Linux is
  # implemented so far; add runners here as the other platforms are written.
  desktop:
    needs: tests
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64, ext: '' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      # WebKitGTK 4.1 — Ubuntu 24.04 dropped 4.0 entirely, which is also why
      # the maintained Go webview bindings cannot build here.
      - name: Install webview headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build desktop app
        working-directory: clients
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -ldflags="-s -w" -o "../dist/pn-scripts-assistant-${{ matrix.target }}${{ matrix.ext }}" ./cmd/pn-scripts-assistant

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: clients/dist/*

  release:
    name: Publish release
    # contents: to create the release and attach the files.
    # id-token + attestations: to sign a provenance statement for each one —
    # see the attestation step below.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Including every installer: a release that publishes everything except
    # the thing the documentation tells people to install is not a release.
    # One per system — the .deb, the .dmg, the Windows setup — and the plain
    # archives beside them for anybody who would rather not install anything.
    needs: [tests, deb, macos, windows, cli, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # One list of checksums over everything published, written here because
      # here is the only place that has everything: the .deb comes from the
      # Ubuntu runner, the disk images from the Mac and the installer from
      # Windows, and a sums file from any one of them covers a third of the
      # release. Somebody checking a download should not have to work out
      # which machine made it.
      - name: Gather the files and sum them
        run: |
          mkdir -p release
          find artifacts -type f ! -name SHA256SUMS -exec cp -n {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Where each file came from, in a form somebody else can check.
      #
      # Nothing here is signed with a certificate — an Apple one and a Windows
      # one cost money every year and identify a company, and this program has
      # neither. That is said plainly in the documentation, and it leaves a
      # real question unanswered: a checksum proves a download matches a
      # published number, and nothing proves the published number came from
      # this source rather than from somebody who got at the release page.
      #
      # A provenance attestation answers it. GitHub signs a statement binding
      # each file to this repository, this workflow file and this commit, using
      # a short-lived key it holds rather than one kept here. Anybody can check
      # it, with no account and nothing installed but the GitHub CLI:
      #
      #     gh attestation verify <file> --repo pnscripts/pn-scripts-assistant
      #
      # It is free, it needs no secret, and it is the one form of "this is
      # genuinely ours" this project can honestly offer.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'release/*'

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
