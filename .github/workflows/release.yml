name: Release

# Builds every distributable artifact. Runs in CI rather than locally so that
# release binaries come from a clean machine rather than somebody's laptop, and
# so that the Windows and macOS builds happen on Windows and macOS.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing ships if the safety properties are broken.
  #
  # The Laravel core this job used to run went when the program became one Go
  # binary; the job outlived it and could only fail. These are the tests there
  # are now — the gates, the confinement and the evidence rules among them.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: clients/go.sum

      # CGO for the window layer; the tests themselves need no display.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - run: go test ./...
        working-directory: clients
        env:
          CGO_ENABLED: '1'

      # Known vulnerabilities, in what is imported and in the toolchain
      # itself. The first run of this found twenty-eight in the standard
      # library; none was in this code, and all were fixed by raising the
      # toolchain in go.mod.
      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: clients

  # The package people actually install, built and checked where nobody's
  # laptop can help it along.
  #
  # This was the gap that mattered: every artifact was built in CI except the
  # one the documentation tells somebody to install. A .deb that is only ever
  # built by hand is a .deb whose build is discovered to be broken on the
  # evening of a release.
  #
  # lintian with --fail-on error,warning, because the package is clean today
  # and the only way it stays clean is a job that refuses when it is not.
  deb:
    needs: tests
    name: Ubuntu package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is worked out from the tag and the commit, and a
          # shallow checkout has neither.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: clients/go.sum

      - name: Install what the window and the packaging need
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            dpkg-dev fakeroot lintian desktop-file-utils

      - name: Build the package
        run: make package
        env:
          CGO_ENABLED: '1'

      - name: Check it from the outside
        run: make validate

      - name: Checksums
        run: make checksums

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: |
            build/packages/*.deb
            build/packages/SHA256SUMS

  # The CLI is pure standard library, so every target still cross-compiles from
  # one Linux runner.
  cli:
    needs: tests
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: '' }
          - { goos: linux,   goarch: arm64, ext: '' }
          - { goos: darwin,  goarch: amd64, ext: '' }
          - { goos: darwin,  goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The parts this job is actually about: the setup flow, the starter and
      # what they check, which are the first thing a new user meets.
      #
      # It used to run every test in the module, with cgo on and without the
      # GTK and WebKit headers this job does not install — so every package
      # that reaches the window failed to build, and the job reported a broken
      # program where there was a missing library. The brain's own tests,
      # window included, run in the Tests job, which installs them.
      - name: Test the client packages
        working-directory: clients
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/setup/... ./internal/preflight/... ./internal/starter/... ./internal/stage/... ./internal/protocol/...

      - name: Build doctor
        working-directory: clients
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o "../dist/pn-scripts-assistant-doctor-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/doctor

      - name: Build CLI
        working-directory: clients
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o "../dist/pn-scripts-assistant-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/cli

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: clients/dist/*

  # The desktop app draws a real native window, which means cgo against the
  # platform's own web engine — and cgo cannot be cross-compiled without a full
  # cross toolchain. Each OS therefore builds on its own runner. Only Linux is
  # implemented so far; add runners here as the other platforms are written.
  desktop:
    needs: tests
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64, ext: '' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # WebKitGTK 4.1 — Ubuntu 24.04 dropped 4.0 entirely, which is also why
      # the maintained Go webview bindings cannot build here.
      - name: Install webview headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build desktop app
        working-directory: clients
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -ldflags="-s -w" -o "../dist/pn-scripts-assistant-${{ matrix.target }}${{ matrix.ext }}" ./cmd/pn-scripts-assistant

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: clients/dist/*

  release:
    name: Publish release
    # Including the .deb: a release that publishes everything except the
    # thing the documentation tells people to install is not a release.
    needs: [tests, deb, cli, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
