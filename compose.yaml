services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        # Loopback only. Docker's default binds published ports to every
        # interface, which put an unauthenticated Pn-Brain on the whole local
        # network: anyone on it could read the knowledge base, chat with the
        # brain — and read_file is a safe tool that runs without asking, over
        # mounts that include personal documents — and, worst of all, POST to
        # /api/approvals to approve a pending action, defeating the entire
        # permission gate from another machine.
        #
        # Nothing here authenticates, because it is built as a personal desktop
        # application. Exposing it beyond this host means adding authentication
        # first, not changing this line.
        ports:
            - '127.0.0.1:${APP_PORT:-80}:80'
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - '${SCAN_DEV_PROJECTS_PATH}:/mnt/scan/dev-projects:ro'
            - '${SCAN_HOME_PROJECTS_PATH}:/mnt/scan/home-projects:ro'
            - '${SCAN_DOCUMENTS_PATH}:/mnt/scan/documents:ro'
            # The one writable area. Everything the brain creates on its own
            # lands here, inside the portable data root, so it travels with the
            # brain and never scatters files across the host.
            - '${BRAIN_DATA_ROOT}/workspace:/mnt/workspace'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
    queue:
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
        entrypoint: ['php', '/var/www/html/artisan', 'queue:work', '--tries=1', '--sleep=3']
    pgsql:
        image: 'pgvector/pgvector:pg16'
        # Loopback only: the database holds every conversation and everything
        # the brain has learned, and it was reachable from the LAN.
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - '${BRAIN_DATA_ROOT}/postgres:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        # Loopback only. Redis has no password here, by design — it should not
        # be reachable by anything but this host.
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - '${BRAIN_DATA_ROOT}/redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
